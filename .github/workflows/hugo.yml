name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # <--- Geüpdatet naar Node 22 voor Hugo --permission ondersteuning

      - name: Install Tailwind CSS v3 & Dependencies
        run: |
          # 1. Installeer Tailwind CSS v3 wereldwijd
          npm install -g tailwindcss@3 postcss autoprefixer --legacy-peer-deps

          # 2. Voeg de globale npm binary map toe aan het GITHUB_PATH
          echo "$(npm config get prefix)/bin" >> $GITHUB_PATH

          # 3. Installeer afhankelijkheden van het hoofdproject (indien aanwezig)
          if [ -f package.json ]; then
            npm install --legacy-peer-deps
            echo "$GITHUB_WORKSPACE/node_modules/.bin" >> $GITHUB_PATH
          fi

          # 4. Installeer afhankelijkheden van het thema (indien aanwezig)
          if [ -f themes/bigspring-light-hugo/package.json ]; then
            npm --prefix themes/bigspring-light-hugo install --legacy-peer-deps
            echo "$GITHUB_WORKSPACE/themes/bigspring-light-hugo/node_modules/.bin" >> $GITHUB_PATH
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Build site
        env:
          HUGO_SECURITY_EXEC_ALLOW: '.*'
          HUGO_ENVIRONMENT: production
        run: hugo --minify --baseURL "https://www.madebyjm.com/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4