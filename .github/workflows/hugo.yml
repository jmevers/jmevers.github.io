name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tailwind CSS (Node.js Script)
        run: |
          # 1. Installeer Tailwind CSS wereldwijd via NPM (maakt een Node script aan)
          npm install -g tailwindcss postcss autoprefixer

          # 2. Maak een symlink van het NPM Node script naar /usr/local/bin/tailwindcss
          TAILWIND_SCRIPT=$(which tailwindcss)
          sudo ln -sf "$TAILWIND_SCRIPT" /usr/local/bin/tailwindcss

          # 3. Installeer eventuele thema- plugins (zoals @tailwindcss/typography)
          if [ -f package.json ]; then
            npm ci || npm install
          fi
          if [ -f themes/bigspring-light-hugo/package.json ]; then
            npm --prefix themes/bigspring-light-hugo install
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Build site
        env:
          HUGO_SECURITY_EXEC_ALLOW: '.*'
          HUGO_ENVIRONMENT: production
        run: hugo --minify --baseURL "https://www.madebyjm.com/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4